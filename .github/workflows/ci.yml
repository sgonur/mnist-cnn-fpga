name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint RTL
        run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run cocotb tests
        run: make test PYTEST_ARGS=--junitxml=test-results.xml
      - name: Upload results and waveforms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-results
          path: |
            test-results.xml
            sim_build/**/*.fst
          retention-days: 7

  # Optional: full Vivado build on a teammate's machine registered as a
  # self-hosted runner with the label "vivado". Uncomment once set up.
